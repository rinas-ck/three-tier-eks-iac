
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-backend
  namespace: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudops-backend-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudops-backend-reader-binding
subjects:
  - kind: ServiceAccount
    name: cloudops-backend
    namespace: backend
roleRef:
  kind: ClusterRole
  name: cloudops-backend-reader
  apiGroup: rbac.authorization.k8s.io
